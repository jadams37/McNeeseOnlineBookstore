<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="css/Product.css">
    <script src="scripts/product.js" defer></script>
    <script src="scripts/auth-nav.js" defer></script>
</head>
<body>

    <header>
        <div class="nav-head">
            <div class="nav-start">
                <div class="logo">
                    <a href="homepage.html" class="logo-label">McNeese Bookstore</a>
                </div>
            </div>

            <div class="nav-center">
                <div class="search">
                    <span class="search-icon">⌕</span>
                    <input class="search-input" type="text" placeholder="Search books, rentals, apparel...">
                </div>
            </div>

            <div class="nav-end">
                <div class="cart">
                    <div class="cart-icon">
                        <img src="icons/cart.svg" alt="Cart">
                    </div>
                    <a href="#" class="cart-label">Cart</a>
                </div>

                <div class="separator"></div>

                <div class="profile">
                    <div class="profile-icon">
                        <img src="icons/profile.svg" alt="Profile">
                    </div>
                    <a href="#" class="profile-label">Profile</a>
                </div>
            </div>
        </div>
    </header>

    <main class="product-page">
        <section class="page-title">
            <h1 id="product-page-title">Shop Products</h1>
            <p id="product-page-subtitle">Find textbooks, rentals, audiobooks, and apparel all in one place.</p>
        </section>

        <section class="product-layout">
            <div class="product-section">
                <h2 id="primary-product-heading">Product Details</h2>
                <div id="primary-product-grid" class="product-grid">
                </div>
            </div>

            <div class="product-section">
                <h2>Need More Options?</h2>
                <div id="related-product-grid" class="product-grid">
                </div>
            </div>
        </section>

        <section class="bottom-buttons">
            <button>Books</button>
            <button>Rentals</button>
            <button>Audiobooks</button>
            <button>Apparel</button>
        </section>
    </main>

    <footer>
        <div class="nav-foot">
            <div class="foot-start">
                <div class="contact">
                    <a href="#" class="contact-label">Contact Us</a>
                    <span class="contact-subtext">support@campusstore.edu</span>
                </div>
            </div>

            <div class="foot-center">
                <span class="hours-label">Store Hours</span>
                <span class="hours-subtext">Mon - Fri: 8 AM - 5 PM</span>
            </div>

            <div class="foot-end">
                <span class="social-label">Follow Us</span>
                <div class="social-links">
                    <a href="#" class="social-icon"><img src="images/facebook.png" alt="Facebook"></a>
                    <a href="#" class="social-icon"><img src="images/instagram.png" alt="Instagram"></a>
                    <a href="#" class="social-icon"><img src="images/twitter.png" alt="Twitter"></a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
