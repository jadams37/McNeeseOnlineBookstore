<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homepage</title>

    <!-- REQUIRED CSS -->
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="homepage_patch.css">
</head>

<body>

<!-- ================= HEADER (EXACT STRUCTURE) ================= -->
<header>
  <div class="nav-head">

    <div class="nav-start">
      <div class="logo">
        <a href="homepage.html" class="logo-label">McNeese Bookstore</a>
      </div>
    </div>

    <div class="nav-center">
      <form class="search" onsubmit="handleSearch(event)">
        <input class="search-input" type="text" placeholder="Search books..." id="searchInput">
      </form>
    </div>

    <div class="nav-end">
      <div class="cart">
        <div class="cart-icon">
          <img src="icons/cart.png">
        </div>
        <a href="#" class="cart-label">Cart</a>
      </div>

      <div class="separator"></div>

      <div class="profile">
        <div class="profile-icon">
          <img src="icons/profile.png">
        </div>
        <a href="Profile.html" class="profile-label">Profile</a>
      </div>
    </div>

  </div>
</header>

<!-- ================= MAIN CONTENT ================= -->
<article>

<div class="page-content">

  <div class="results-container">

    <!-- TITLE -->
    <div class="results-top">
      <h1 class="results-title">Featured Books</h1>
    </div>

    <!-- PRODUCTS -->
    <div class="results-bottom">

      <div class="products-container">

        <div class="product-container">
          <p class="item-name-label">Database Systems</p>
          <p class="item-price-label">$89.99</p>
          <button class="cart-button" onclick="addToCart('Database Systems')">Add to Cart</button>
        </div>

        <div class="product-container">
          <p class="item-name-label">Cybersecurity Basics</p>
          <p class="item-price-label">$74.99</p>
          <button class="cart-button" onclick="addToCart('Cybersecurity Basics')">Add to Cart</button>
        </div>

        <div class="product-container">
          <p class="item-name-label">Web Development</p>
          <p class="item-price-label">$59.99</p>
          <button class="cart-button" onclick="addToCart('Web Development')">Add to Cart</button>
        </div>

        <div class="product-container">
          <p class="item-name-label">Networking Essentials</p>
          <p class="item-price-label">$69.99</p>
          <button class="cart-button" onclick="addToCart('Networking Essentials')">Add to Cart</button>
        </div>

      </div>

    </div>

  </div>

</div>

</article>

<!-- ================= FOOTER (EXACT STRUCTURE) ================= -->
<footer>
  <div class="nav-foot">

    <div class="foot-start">
      <div class="contact">
        <p class="contact-label">Contact</p>
        <p class="contact-subtext">support@mcneese.edu</p>
      </div>
    </div>

    <div class="foot-center">
      <p class="hours-label">Hours</p>
      <p class="hours-subtext">Mon–Fri: 8am–5pm</p>
    </div>

    <div class="foot-end">
      <p class="social-label">Follow Us</p>
      <div class="social-links">
        <div class="social-icon"><img src="icons/facebook.png"></div>
        <div class="social-icon"><img src="icons/twitter.png"></div>
      </div>
    </div>

  </div>
</footer>

<!-- ================= SIMPLE JS ================= -->
<script>
function handleSearch(e) {
    e.preventDefault();
    const query = document.getElementById("searchInput").value;
    window.location.href = "results.html?search=" + query;
}

function addToCart(item) {
    alert(item + " added to cart!");
}
</script>

</body>
</html>
