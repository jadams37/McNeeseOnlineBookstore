<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/shared.css">
    <script src="scripts/auth-nav.js" defer></script>
    <script src="scripts/search-nav.js" defer></script>
    <script src="scripts/cart.js" defer></script>
    <script src="scripts/checkout.js" defer></script>
</head>
<body>

    <header>
        <div class="nav-head">
            <div class="nav-start">
                <div class="logo">
                    <a href="homepage.html" class="logo-label">McNeese Bookstore</a>
                </div>
            </div>

            <div class="nav-center">
                <div class="search">
                    <span class="search-icon">⌕</span>
                    <input class="search-input" type="text" placeholder="Search books, rentals, apparel...">
                </div>
            </div>

            <div class="nav-end">
                <div class="cart">
                    <div class="cart-icon">
                        <img src="icons/cart.svg" alt="Cart">
                    </div>
                    <a href="cart.html" class="cart-label">Cart</a>
                </div>

                <div class="separator"></div>

                <div class="profile">
                    <a href="login.html" class="profile-link profile-label">
                        <span class="profile-text">Profile</span>
                        <span class="profile-icon"><img src="icons/profile.svg" alt="Profile"></span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="cart-page">
        <section class="page-title">
            <h1>Shopping Cart</h1>
            <p>Review your items and proceed to checkout.</p>
        </section>

        <section class="cart-content">
            <div id="cart-items" class="cart-items">
                <!-- Cart items will be loaded here -->
            </div>

            <div id="cart-summary" class="cart-summary">
                <!-- Cart summary will be loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="nav-foot">
            <div class="foot-start">
                <div class="contact">
                    <a href="mailto:support@mcneesebookstore.edu" class="contact-label">Contact Us</a>
                    <span class="contact-subtext">support@campusstore.edu</span>
                </div>
            </div>

            <div class="foot-center">
                <span class="hours-label">Store Hours</span>
                <span class="hours-subtext">Mon - Fri: 8 AM - 5 PM</span>
            </div>

            <div class="foot-end">
                <span class="social-label">Follow Us</span>
                <div class="social-links">
                    <a href="https://www.facebook.com" class="social-icon"><img src="icons/facebook.png" alt="Facebook"></a>
                    <a href="https://www.instagram.com" class="social-icon"><img src="icons/instagram.png" alt="Instagram"></a>
                    <a href="https://www.tiktok.com" class="social-icon"><img src="icons/tiktok.png" alt="TikTok"></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Checkout</h2>
            <form id="checkout-form">
                <div class="form-section">
                    <h3>Billing Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="billing-name">Full Name *</label>
                            <input type="text" id="billing-name" name="billingName" required>
                        </div>
                        <div class="form-group">
                            <label for="billing-email">Email *</label>
                            <input type="email" id="billing-email" name="billingEmail" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="billing-address">Billing Address *</label>
                        <input type="text" id="billing-address" name="billingAddress" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="billing-city">City *</label>
                            <input type="text" id="billing-city" name="billingCity" required>
                        </div>
                        <div class="form-group">
                            <label for="billing-state">State *</label>
                            <input type="text" id="billing-state" name="billingState" required maxlength="2">
                        </div>
                        <div class="form-group">
                            <label for="billing-zip">ZIP Code *</label>
                            <input type="text" id="billing-zip" name="billingZip" required pattern="[0-9]{5}">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Shipping Information</h3>
                    <div class="form-group checkbox">
                        <label>
                            <input type="checkbox" id="same-as-billing" checked>
                            Same as billing address
                        </label>
                    </div>
                    <div id="shipping-fields" style="display: none;">
                        <div class="form-group">
                            <label for="shipping-name">Full Name</label>
                            <input type="text" id="shipping-name" name="shippingName">
                        </div>
                        <div class="form-group">
                            <label for="shipping-address">Shipping Address</label>
                            <input type="text" id="shipping-address" name="shippingAddress">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="shipping-city">City</label>
                                <input type="text" id="shipping-city" name="shippingCity">
                            </div>
                            <div class="form-group">
                                <label for="shipping-state">State</label>
                                <input type="text" id="shipping-state" name="shippingState" maxlength="2">
                            </div>
                            <div class="form-group">
                                <label for="shipping-zip">ZIP Code</label>
                                <input type="text" id="shipping-zip" name="shippingZip" pattern="[0-9]{5}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Payment Information</h3>
                    <div class="form-group">
                        <label for="card-number">Card Number *</label>
                        <input type="text" id="card-number" name="cardNumber" required placeholder="0000 0000 0000 0000">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="card-name">Name on Card *</label>
                            <input type="text" id="card-name" name="cardName" required>
                        </div>
                        <div class="form-group">
                            <label for="card-expiry">Expiry (MM/YY) *</label>
                            <input type="text" id="card-expiry" name="cardExpiry" required pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="MM/YY" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label for="card-cvv">CVV *</label>
                            <input type="text" id="card-cvv" name="cardCvv" required pattern="[0-9]{3,4}" maxlength="4" placeholder="000">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancel-checkout">Cancel</button>
                    <button type="submit" class="btn-primary">Complete Order</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
